<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Meme Slider</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="slider-container">
        
        <div class="slider">
            <input type="radio" name="slide" id="slide1" checked>
            <input type="radio" name="slide" id="slide2">
            <input type="radio" name="slide" id="slide3">
            <input type="radio" name="slide" id="slide4">

            <div class="slides">
                <div class="slide">
                    <img src="img/apples.png" alt="Meme 1">
                    <div class="slide-content">
                        <div class="slide-text">
                            <p>Meme about apples</p>
                        </div>
                        <div class="navigation">
                            <label for="slide1" class="nav-btn"></label>
                            <label for="slide2" class="nav-btn"></label>
                            <label for="slide3" class="nav-btn"></label>
                            <label for="slide4" class="nav-btn"></label>
                        </div>
                    </div>
                </div>
                <div class="slide">
                    <img src="img/dream.png" alt="Meme 2">
                    <div class="slide-content">
                        <div class="slide-text">
                            <p>Meme about dream</p>
                        </div>
                        <div class="navigation">
                            <label for="slide1" class="nav-btn"></label>
                            <label for="slide2" class="nav-btn"></label>
                            <label for="slide3" class="nav-btn"></label>
                            <label for="slide4" class="nav-btn"></label>
                        </div>
                    </div>
                </div>
                <div class="slide">
                    <img src="img/hpn.png" alt="Meme 3">
                    <div class="slide-content">
                        <div class="slide-text">
                            <p>Meme about New Year</p>
                        </div>
                        <div class="navigation">
                            <label for="slide1" class="nav-btn"></label>
                            <label for="slide2" class="nav-btn"></label>
                            <label for="slide3" class="nav-btn"></label>
                            <label for="slide4" class="nav-btn"></label>
                        </div>
                    </div>
                </div>
                <div class="slide">
                    <img src="img/mushroom.png" alt="Meme 4">
                    <div class="slide-content">
                        <div class="slide-text">
                            <p>Meme about mushrooms</p>
                        </div>
                        <div class="navigation">
                            <label for="slide1" class="nav-btn"></label>
                            <label for="slide2" class="nav-btn"></label>
                            <label for="slide3" class="nav-btn"></label>
                            <label for="slide4" class="nav-btn"></label>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
